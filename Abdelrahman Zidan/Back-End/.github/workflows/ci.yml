name: CI/CD
on:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: testpass, MYSQL_DATABASE: clashofminds_test, MYSQL_USER: testuser, MYSQL_PASSWORD: testpass}
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-retries=5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: --health-cmd="rabbitmq-diagnostics ping" --health-interval=15s --health-retries=5 --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - run: npm ci
      - name: Health check
        env: {DB_HOST: localhost, DB_USER: testuser, DB_PASS: testpass, DB_NAME: clashofminds_test, REDIS_URL: "redis://localhost:6379", RABBITMQ_URL: "amqp://localhost:5672", JWT_SECRET: testsecret, PORT: 3001}
        run: node src/server.js & sleep 8 && curl -f http://localhost:3001/health && echo "✅ OK"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t clash-backend:test . && docker compose config --quiet && echo "✅ Docker OK"
