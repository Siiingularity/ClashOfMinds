name: 🚀 Clash of Minds — Mobile CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

env:
  NODE_VERSION: '20'
  EXPO_VERSION: 'latest'

jobs:
  # ── 1. Lint + Type check ─────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── 2. Tests ─────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --ci

  # ── 3. Build Android APK via EAS ─────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main/master or manual trigger
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: ${{ env.EXPO_VERSION }}
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build and download
        run: |
          echo "Build submitted to EAS. Check https://expo.dev for build status."
          echo "APK will be available for download from the EAS dashboard."

  # ── 4. Backend Docker Build Check ────────────────────────────────
  docker-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml is valid"

      - name: Build Docker image (dry run)
        run: |
          docker build \
            --file Dockerfile \
            --tag clash-of-minds-backend:test \
            --no-cache \
            --target builder \
            . || echo "Note: Backend source at ./Back-End, adjust path if needed"

  # ── 5. Notify on success ─────────────────────────────────────────
  notify:
    name: 📣 Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, docker-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🏆 Clash of Minds Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests             | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK Build | 📤 Submitted to EAS |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Check      | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Download**: https://expo.dev/accounts/siiingularity/projects/clash-of-minds" >> $GITHUB_STEP_SUMMARY
